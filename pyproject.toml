[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquatwin"
version = "1.0.0"
description = "AquaTwin AI: physics-informed digital twin for water-network leak detection, localisation and predictive maintenance"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["aquatwin*"]

[project.scripts]
aquatwin = "aquatwin.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
